name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry sync --no-interaction --no-root

      - name: Run tests
        run: poetry run pytest -q

  postgresql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: fip_user
      POSTGRES_PASSWORD: fip_password
      POSTGRES_MIGRATION_USER: postgres
      POSTGRES_MIGRATION_PASSWORD: postgres
      ACCOUNTING_POSTING_TOKEN: ci-test-accounting-posting-token
      POSTGRES_DB: fip_test
      POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://fip_user:fip_password@localhost:5432/fip_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry sync --no-interaction --no-root

      - name: Provision restricted application role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d fip_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE fip_user LOGIN PASSWORD 'fip_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          GRANT CONNECT ON DATABASE fip_test TO fip_user;
          GRANT USAGE ON SCHEMA public TO fip_user;
          SQL

      - name: Apply migrations with migration role
        run: poetry run alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: poetry run pytest -q backend/tests/integration/postgresql
