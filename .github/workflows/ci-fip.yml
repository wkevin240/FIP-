name: FIP CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fip_user -d fip_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run unit tests
        run: pytest -q backend/tests/unit
      - name: Apply database migrations
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: alembic upgrade head
      - name: Verify balance-sheet PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_balance_sheet_postgres_integrity.py
      - name: Verify audit-log PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_audit_log_postgres_integrity.py
      - name: Verify ledger PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_ledger_postgres_integrity.py
      - name: Verify ledger provenance PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_ledger_provenance_postgres_integrity.py
      - name: Verify posted journal PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_journal_balance_postgres_integrity.py
      - name: Verify fiscal-period PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_fiscal_period_postgres_integrity.py
      - name: Verify journal fiscal-period PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_journal_fiscal_period_postgres_integrity.py
      - name: Verify journal-entry date PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_journal_entry_date_postgres_integrity.py
      - name: Verify account hierarchy PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_account_hierarchy_postgres_integrity.py
      - name: Verify journal-entry-line account tenant PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_journal_entry_line_account_tenant_postgres_integrity.py
      - name: Verify fiscal-year PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_fiscal_year_postgres_integrity.py
      - name: Verify journal reversal tenant PostgreSQL invariants
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: pytest -q backend/tests/integration/test_journal_reversal_tenant_postgres_integrity.py
      - name: Verify migration drift
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: alembic check
