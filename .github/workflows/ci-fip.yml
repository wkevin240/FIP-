name: FIP CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fip_user -d fip_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run unit tests
        run: pytest -q
      - name: Apply database migrations
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: alembic upgrade head
      - name: Verify migration drift
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: fip_user
          POSTGRES_PASSWORD: fip_password
          POSTGRES_DB: fip_db
        run: alembic check
