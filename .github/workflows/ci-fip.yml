name: FIP CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry export --without-hashes -f requirements.txt -o requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: Run tests
        run: pytest -q
